[project]
name = "onto-datamodel"
version = "0.1.0"
description = "Citation-grounded ontology generation from a dbt project, with a mandatory human signoff gate."
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "pydantic>=2.11",
    "rdflib>=7.1",
    "pyshacl>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]
seed-gen = [
    "faker>=30.0",
]

[tool.uv]
package = false
